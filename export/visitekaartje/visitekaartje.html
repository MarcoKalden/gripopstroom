<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visitekaartje Alexander van Hattum</title>
<!--
  Visitekaartje Grip op Stroom, 85 x 55 mm.
  Afdrukken/PDF: elke pagina is 91 x 61 mm (3 mm afloop rondom).
  Kleuren en lettertype volgen css/styles.css (--gos-*, Figtree).
-->
<style>
  @font-face { font-family: "Figtree"; src: url("../../assets/fonts/figtree-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Figtree"; src: url("../../assets/fonts/figtree-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "Figtree"; src: url("../../assets/fonts/figtree-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Figtree"; src: url("../../assets/fonts/figtree-latin-700-normal.woff2") format("woff2"); font-weight: 700; }

  :root {
    --gos-navy: #0A2A5E;
    --gos-ink: #10233F;
    --gos-text: #3A4A60;
    --gos-ground: #F2F6F5;
    --gos-sand: #E3ECEA;
    --gos-line: #D3DFDC;
    --gos-green: #1F7A63;
    --gos-leaf: #7FB069;
    --gos-wave: #48B4BA;
    --gos-on-navy: #D6DEEA;
    --gos-on-navy-accent: #9FD3BF;
    --bleed: 3mm;
    --safe: 4mm;
  }

  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Figtree", system-ui, sans-serif; background: var(--gos-sand); color: var(--gos-ink);
         -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  /* Schermweergave: kaart op snijmaat, afloop weggesneden */
  .preview { min-height: 100vh; display: flex; flex-wrap: wrap; gap: 32px; align-items: center; justify-content: center; padding: 32px 16px; }
  .preview figure { display: grid; gap: 10px; justify-items: center; }
  .preview figcaption { font-size: 13px; color: var(--gos-text); }
  .trim { width: 85mm; height: 55mm; overflow: hidden; border-radius: 3mm; box-shadow: 0 2px 6px rgba(16,35,63,.05), 0 10px 30px rgba(16,35,63,.12); }
  .trim .sheet { margin: calc(var(--bleed) * -1); }

  .sheet { width: 91mm; height: 61mm; position: relative; overflow: hidden; }
  .card { position: absolute; inset: 0; padding: calc(var(--bleed) + var(--safe)); }

  /* ---------- Voorkant ---------- */
  .front { background: #fff; display: grid; grid-template-columns: 27mm 1fr; column-gap: 5mm; align-items: center;
           padding-left: 0; }
  .front__brand { align-self: stretch; margin: calc((var(--bleed) + var(--safe)) * -1) 0; padding-left: var(--bleed);
                  background: var(--gos-ground); display: grid; place-items: center; }
  .front__brand img { width: 19mm; height: auto; display: block; }
  .front__name { font-size: 11.5pt; font-weight: 700; color: var(--gos-navy); letter-spacing: -.01em; line-height: 1.1; }
  .front__role { font-size: 7.5pt; font-weight: 600; color: var(--gos-green); margin-top: .8mm; letter-spacing: .04em; text-transform: uppercase; }
  .front__rule { width: 8mm; height: .6mm; border-radius: 1mm; background: var(--gos-leaf); margin: 3mm 0 2.6mm; }
  .contact { list-style: none; padding: 0; display: grid; gap: 1.5mm; font-size: 7pt; line-height: 1.3; color: var(--gos-text); }
  .contact li { display: grid; grid-template-columns: 3.2mm 1fr; column-gap: 1.8mm; align-items: start; }
  .contact svg { width: 3.2mm; height: 3.2mm; color: var(--gos-green); margin-top: .1mm; }
  .contact strong { font-weight: 600; color: var(--gos-ink); }
  .front__wave { position: absolute; right: 0; bottom: 1.5mm; width: 34mm; height: 9mm; }

  /* ---------- Achterkant ---------- */
  .back { background: var(--gos-navy); color: #fff; display: grid; grid-template-columns: 1fr 26mm; column-gap: 5mm; align-items: center; }
  .back__payoff { font-size: 12.5pt; font-weight: 700; line-height: 1.15; letter-spacing: -.01em; }
  .back__payoff span { color: var(--gos-on-navy-accent); }
  .back__hint { font-size: 6.8pt; line-height: 1.35; color: var(--gos-on-navy); margin-top: 3mm; max-width: 40mm; }
  .back__url { font-size: 7pt; font-weight: 600; color: #fff; margin-top: 4.5mm; letter-spacing: .02em; }
  .qr { background: #fff; border-radius: 2.5mm; padding: 1.2mm; width: 26mm; }
  .qr__code { display: block; width: 100%; height: auto; }
  .back__wave { position: absolute; left: 0; bottom: 1.5mm; width: 100%; height: 10mm; opacity: .5; }

  @page { size: 91mm 61mm; margin: 0; }
  @media print {
    body { background: none; }
    .preview { display: block; padding: 0; min-height: 0; }
    .preview figure { display: block; break-after: page; }
    .preview figcaption { display: none; }
    .trim { width: auto; height: auto; overflow: visible; border-radius: 0; box-shadow: none; }
    .trim .sheet { margin: 0; }
  }
</style>
</head>
