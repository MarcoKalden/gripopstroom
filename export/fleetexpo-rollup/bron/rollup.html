<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Signika:wght@400;600;700&family=Outfit:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
@page{size:856mm 2006mm;margin:0}
:root{--b:#1E71B7;--bd:#03558D;--bm:#0B66AB;--gl:#D0D0D2;--lav:#E8EAF4}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:856mm;height:2006mm;background:#fff}
.p{position:relative;width:856mm;height:2006mm;overflow:hidden;background:#fff;font-family:'Outfit',sans-serif;color:#1d2b3a}
/* inhoud t.o.v. snijlijn: +3mm */
.abs{position:absolute}
.logo{left:93mm;top:95mm;width:670mm}

.ph{left:0;top:330mm;width:856mm;height:820mm;clip-path:polygon(0 9%,100% 0,100% 91%,0 100%);background:var(--bd)}
.ph .img{position:absolute;inset:0;background:url(photo.jpg) 22% 40%/auto 1050mm no-repeat}
.ph .t1{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,85,141,.05) 0%,rgba(30,113,183,.15) 35%,rgba(30,113,183,.85) 68%,rgba(3,85,141,.97) 100%)}
.ph .t2{position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,85,141,.55),rgba(3,85,141,0) 60%)}
.pill{left:68mm;top:668mm;border:2.6mm solid #fff;color:#fff;border-radius:40mm;padding:9mm 26mm;font-size:26mm;font-weight:600;letter-spacing:5mm;text-transform:uppercase}
.head{left:68mm;top:770mm;color:#fff;font-family:'Signika',sans-serif;font-weight:700;font-size:82mm;line-height:1.08;letter-spacing:-1mm}
.head span{display:block}
.intro{left:68mm;top:1150mm;font-family:'Signika',sans-serif;font-weight:600;font-size:40mm;color:var(--b);letter-spacing:-.3mm}
.prods{left:68mm;top:1225mm;width:720mm;display:flex;gap:18mm}
.prods div{flex:1;height:115mm;border-radius:60mm;background:var(--b);color:#fff;font-family:'Signika',sans-serif;font-weight:700;font-size:44mm;display:flex;align-items:center;justify-content:center;letter-spacing:-.5mm}
.prods div:nth-child(2){background:var(--bm)}
.prods div:nth-child(3){background:var(--bd)}
.list{left:68mm;top:1385mm;width:720mm}
.list li{list-style:none;display:flex;align-items:center;gap:26mm;font-size:38mm;font-weight:500;height:76mm;border-bottom:1.2mm solid var(--gl)}
.list li:last-child{border-bottom:0}
.ic{width:56mm;height:56mm;border-radius:50%;border:3.4mm solid var(--b);flex:none;display:flex;align-items:center;justify-content:center}
.ic svg{width:30mm;height:30mm}
.lavbot{left:0;top:1300mm;width:856mm;height:706mm;background:var(--lav);clip-path:polygon(0 25%,45% 100%,0 100%)}
.cta{left:0;top:1712mm;width:856mm;height:294mm;background:var(--b);clip-path:polygon(0 0,100% 12%,100% 100%,0 100%)}
.ctat{left:68mm;top:1765mm;color:#fff;font-family:'Signika',sans-serif;font-weight:700;font-size:48mm;letter-spacing:-.4mm}
.ctas{left:68mm;top:1832mm;color:#fff;font-size:30mm;font-weight:500;opacity:.95}
.tr1{right:0;top:1520mm;width:300mm;height:486mm;background:var(--bm);clip-path:polygon(100% 0,100% 100%,0 100%)}
.tr2{right:0;top:1520mm;width:300mm;height:486mm;background:var(--bd);clip-path:polygon(100% 35%,100% 100%,40% 100%)}
.url{left:68mm;top:1150mm}

<li><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#1E71B7" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Minder handmatige invoer</li>
<li><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#1E71B7" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Snellere werkprocessen</li>
<li><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#1E71B7" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Grip op wagenpark &amp; kosten</li>
</ul>
<div class="abs tr1"></div><div class="abs tr2"></div>
<div class="abs cta"></div>
<div class="abs ctat">Bespaar tijd en kosten. Vraag ons hoe!</div>
<div class="abs ctas">www.conneqtech.com</div>
</div></body></html>
