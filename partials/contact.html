<div class="contact">
  <div class="address-card">
    <h3 data-text="contact.address.name">Grip op Stroom B.V.</h3>
    <address data-if="contact.address">
      <span data-text="contact.address.street">Handelsweg 14</span><br>
      <span data-text="contact.address.postcode">7041 GX</span> <span data-text="contact.address.city">'s-Heerenberg</span>
    </address>
    <ul class="contact-lines">
      <li data-if="contact.phone">
        <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-phone"></use></svg>
        <div><strong data-text="contact.phone.label">Bel ons</strong><a href="tel:+31262056179" data-href="contact.phone.href" data-text="contact.phone.display" data-cta="contact-bellen">026 205 6179</a></div>
      </li>
      <li data-if="contact.email" hidden>
        <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-mail"></use></svg>
        <div><strong data-text="contact.email.label">Mail ons</strong><a data-href="contact.email.href" data-text="contact.email.display" data-cta="contact-mail"></a></div>
      </li>
      <li data-if="contact.hours">
        <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-clock"></use></svg>
        <div><span data-text="contact.hours.text">Iedere werkdag van 08:00 tot 17:00</span></div>
      </li>
    </ul>
  </div>

  <form class="form-card" data-contact-form novalidate>
    <h3 data-text="contactForm.title">Stuur ons een bericht</h3>
    <div class="form-grid">
      <div class="field">
        <label for="cf-naam" data-text="contactForm.fields.naam">Naam</label>
        <input id="cf-naam" name="naam" type="text" autocomplete="name" required aria-describedby="cf-naam-err">
        <p class="field__error" id="cf-naam-err" data-error-for="naam" hidden></p>
      </div>
      <div class="field">
        <label for="cf-email" data-text="contactForm.fields.email">E-mail</label>
        <input id="cf-email" name="email" type="email" autocomplete="email" required aria-describedby="cf-email-err">
        <p class="field__error" id="cf-email-err" data-error-for="email" hidden></p>
      </div>
      <div class="field">
        <label for="cf-telefoon" data-text="contactForm.fields.telefoon">Telefoon</label>
        <input id="cf-telefoon" name="telefoon" type="tel" autocomplete="tel" required aria-describedby="cf-telefoon-err">
        <p class="field__error" id="cf-telefoon-err" data-error-for="telefoon" hidden></p>
      </div>
      <div class="field">
        <label for="cf-postcode" data-text="contactForm.fields.postcode">Postcode</label>
        <input id="cf-postcode" name="postcode" type="text" autocomplete="postal-code" required pattern="^[1-9][0-9]{3}\s?[A-Za-z]{2}$" aria-describedby="cf-postcode-err">
        <p class="field__error" id="cf-postcode-err" data-error-for="postcode" hidden></p>
      </div>
      <div class="field field--full">
        <label for="cf-bericht" data-text="contactForm.fields.bericht">Bericht</label>
        <textarea id="cf-bericht" name="bericht" rows="5" required aria-describedby="cf-bericht-err"></textarea>
        <p class="field__error" id="cf-bericht-err" data-error-for="bericht" hidden></p>
      </div>
      <div class="honeypot" aria-hidden="true">
        <label for="cf-website">Laat dit veld leeg</label>
        <input id="cf-website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>
      <p class="form-status" data-form-status role="status" aria-live="polite" hidden></p>
      <div class="form-foot">
        <button class="btn btn--primary" type="submit" data-cta="contactformulier" data-text="contactForm.submit">Verzenden</button>
        <p><span data-text="contactForm.privacy">We gebruiken je gegevens alleen om contact met je op te nemen.</span> <a href="privacy.html" data-href="links.privacy" data-text="contactForm.privacyLink">Lees de privacyverklaring</a></p>
      </div>
    </div>
  </form>
</div>
